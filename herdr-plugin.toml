id = "git-upstream"
name = "Git Upstream"
version = "0.2.0"
# 0.7.5 부터 workspace 메타데이터 토큰과 [[startup]] 훅을 모두 쓸 수 있다.
min_herdr_version = "0.7.5"
description = "Keep git remote-tracking refs fresh so the herdr sidebar shows how far behind each Space really is, fetch in the background, and start new worktrees from the latest upstream. Linux, macOS, Windows."
platforms = ["linux", "macos", "windows"]

# 의존성 없는 Go 표준 라이브러리만 쓰므로, 설치 시 go build 한 번이면 끝난다.
[[build]]
platforms = ["linux", "macos"]
command = ["sh", "scripts/build.sh"]

[[build]]
platforms = ["windows"]
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts/build.ps1"]

# startup 훅은 일회성이다. --detach 가 데몬을 띄우고 즉시 반환하므로 훅이 깔끔하게 끝난다.
[[startup]]
command = ["./bin/herdr-git-upstream", "daemon", "--detach"]

# 포커스 이벤트는 두 가지 일을 한다.
# 1) 방금 본 저장소를 즉시 갱신한다(스로틀 안에서).
# 2) 데몬이 죽었거나 아직 뜨지 않았으면 띄운다. startup 훅은 plugin link/enable 때는 발화하지 않기 때문에,
#    이 경로가 없으면 herdr 를 재시작할 때까지 아무 일도 일어나지 않는다.
[[events]]
on = "workspace.focused"
command = ["./bin/herdr-git-upstream", "fetch"]

[[events]]
on = "pane.focused"
command = ["./bin/herdr-git-upstream", "fetch"]

# herdr는 worktree를 만들 때 fetch를 하지 않고 원본 체크아웃의 HEAD를 기준으로 삼는다.
# 손에 쥔 브랜치가 뒤처져 있으면 새 worktree도 뒤처진 자리에서 시작하므로, 만들어진 직후에
# 기준 브랜치를 가져와 빨리 감기로 맞춘다. config.json 의 fresh_worktrees 로 끌 수 있다.
[[events]]
on = "worktree.created"
command = ["./bin/herdr-git-upstream", "worktree-created"]

# worktree 화면은 진짜 터미널을 받는 pane 으로 뜬다. placement 는 popup 인데 CLI 의 --placement 목록에는
# popup 이 없어서, 액션은 placement 를 비운 채 `plugin pane open` 을 불러 이 값을 따르게 한다. 크기는 표 한 줄에
# 판정·이름·설명 세 열이 들어가고 worktree 스물일곱 개가 한눈에 보이도록 넉넉히 잡았다. 명령이 상대 경로인 것은
# 다른 항목과 같다. 윈도우에서 상대 경로 pane 명령이 도는지는 미실측이다(docs/PLAN.md).
[[panes]]
id = "worktrees"
title = "Worktrees"
placement = "popup"
width = "90%"
height = "80%"
command = ["./bin/herdr-git-upstream", "worktrees"]

# 기준 후보를 고르는 생성 팝업은 setup 의 주석 처리된 키를 통해 선택적으로 사용한다.
[[panes]]
id = "new-worktree"
title = "New worktree"
placement = "popup"
width = 64
height = 18
command = ["./bin/herdr-git-upstream", "new-worktree"]

[[actions]]
id = "new-worktree"
title = "Git Upstream: new worktree"
description = "Choose a base branch and create a worktree from a fresh remote-tracking ref."
contexts = ["global", "workspace"]
command = ["./bin/herdr-git-upstream", "open-new-worktree"]

# herdr 에는 액션을 골라 실행하는 화면이 없어서 이 액션은 키에 묶어야 보인다(setup 명령이 그 설정을 내놓는다).
# contexts 는 herdr 가 아직 쓰지 않지만, 워크스페이스 문맥에서 열리면 HERDR_WORKSPACE_ID 가 그 저장소를 정한다.
[[actions]]
id = "worktrees"
title = "Git Upstream: worktrees"
description = "이 저장소의 worktree 전부를 판정(safe/review/keep/blocked)과 함께 보이고 safe 인 것을 지운다."
contexts = ["global", "workspace"]
command = ["./bin/herdr-git-upstream", "open-worktrees"]

[[actions]]
id = "refresh"
title = "Git Upstream: 지금 모두 갱신"
description = "열려 있는 모든 워크스페이스를 즉시 fetch 하고 토큰을 다시 보고한다."
contexts = ["global"]
command = ["./bin/herdr-git-upstream", "refresh"]

[[actions]]
id = "start"
title = "Git Upstream: 데몬 시작"
contexts = ["global"]
command = ["./bin/herdr-git-upstream", "daemon", "--detach"]

[[actions]]
id = "stop"
title = "Git Upstream: 데몬 중지"
contexts = ["global"]
command = ["./bin/herdr-git-upstream", "stop"]
